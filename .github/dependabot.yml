# Keeps the SHA-pinned actions in the fork's workflows up to date. Application
# dependencies come from upstream LearnHouse releases (fork-upstream-sync.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
