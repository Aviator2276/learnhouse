# Build, scan, sign and publish the all-in-one image to GHCR.
#
#   ghcr.io/<owner>/<repo>:latest          newest build of main (what Unraid pulls)
#   ghcr.io/<owner>/<repo>:<upstream>      e.g. 1.4.4, the LearnHouse release it is based on
#   ghcr.io/<owner>/<repo>:<upstream>-<sha> immutable, for pinning / rollback
#
# Runs on every merge to main (PR CI already gated it) and weekly, so base
# image security patches (Alpine, Python, Bun) reach the server even when
# LearnHouse itself has not released.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
      issues: write # vulnerability tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        id: v
        run: |
          upstream=$(tr -d '[:space:]' < .fork/UPSTREAM_VERSION)
          echo "$upstream" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.v.outputs.image }}:scan
          build-args: |
            LEARNHOUSE_PUBLIC=true
            BUILD_ID=${{ github.sha }}
          # The weekly run rebuilds from fresh base images on purpose.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Vulnerability scan
        # Reported, not blocking: findings almost always come from versions
        # pinned upstream, and holding back a release would leave the server
        # on an image with the same findings plus older code. They are tracked
        # in one issue below, which closes itself once they are gone.
        id: scan
        env:
          IMAGE: ${{ steps.v.outputs.image }}:scan
        run: |
          bash .fork/scan.sh "$IMAGE" "$RUNNER_TEMP/scan.md"
          cat "$RUNNER_TEMP/scan.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.v.outputs.image }}:latest
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.upstream }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.upstream }}-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.upstream }}
            org.opencontainers.image.title=LearnHouse (Authentik)
            org.opencontainers.image.licenses=AGPL-3.0
          build-args: |
            LEARNHOUSE_PUBLIC=true
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=amd64

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Track fixable critical vulnerabilities in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRITICALS: ${{ steps.scan.outputs.criticals }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Security: fixable critical vulnerabilities in the published image"
          gh label create security --color B60205 --description "Security findings" 2>/dev/null || true
          existing=$(gh issue list --label security --state open --search "in:title \"${title}\"" --json number --jq '.[0].number' || true)
          if [ "${CRITICALS:-0}" != "0" ]; then
            body="$(cat "$RUNNER_TEMP/scan.md")

          These usually come from versions LearnHouse pins upstream and clear with a later upstream release or the weekly base-image rebuild. This issue is updated by every publish and closes itself once the image is clean.

          Run: ${RUN_URL}"
            if [ -n "$existing" ]; then gh issue edit "$existing" --body "$body"; else gh issue create --title "$title" --label security --body "$body"; fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolved: the image published by ${RUN_URL} has no fixable critical vulnerabilities."
          fi

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          {
            echo "### Published"
            echo "\`${IMAGE}:latest\` = \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Verify: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
